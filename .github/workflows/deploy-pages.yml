name: Desplegar en GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Next.js para GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar aplicación web con basePath para GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Desactivar motor Jekyll en GitHub Pages (.nojekyll)
        run: touch out/.nojekyll

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Desplegar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
