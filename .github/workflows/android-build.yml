name: Compilar APK Android Oficial y Publicar Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar aplicación web Next.js (Export estático)
        run: npm run build

      - name: Sincronizar proyecto nativo Android con Capacitor
        run: npx cap sync android

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Android (assembleRelease)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK para distribución oficial
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/AcAFaltaLaMuni-Osorno-v1.0.0.apk

      - name: Subir artefacto APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: AcAFaltaLaMuni-Osorno-v1.0.0.apk
          path: dist-apk/AcAFaltaLaMuni-Osorno-v1.0.0.apk

      - name: Publicar Release oficial en GitHub
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Acá Falta la Muni — Osorno v1.0.0 (Lanzamiento Oficial)"
          body: |
            ## Acá Falta la Muni — Osorno v1.0.0
            Paquete oficial instalable para dispositivos Android.
            
            - **Autor:** Pablo Benavides Jorquera
            - **Contacto:** acafaltalamuniosorno@gmail.com
            - **Plataforma web en vivo:** https://aca-falta-la-muni-osorno.web.app
            - **Licencia:** Software Libre y Código Abierto para la comunidad de Osorno.
            
            ### Descarga:
            Descarga el archivo `AcAFaltaLaMuni-Osorno-v1.0.0.apk` adjunto a continuación e instálalo en tu teléfono.
            Si usas **Obtainium**, agrega la URL de este repositorio para recibir actualizaciones automáticas con 1 toque.
          files: dist-apk/AcAFaltaLaMuni-Osorno-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
